name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Unzip project
        run: |
          unzip -q "kalyan fast.zip" -d extracted_folder

      - name: Find and Build
        run: |
          cd extracted_folder
          PUB_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Found pubspec in: $PUB_DIR"
          cd "$PUB_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "extracted_folder/**/build/app/outputs/flutter-apk/app-release.apk"
