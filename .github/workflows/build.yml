name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List files for debugging
        run: ls -la

      - name: Unzip project
        run: |
          if [ -f "kalyan fast.zip" ]; then
            unzip -q "kalyan fast.zip" -d extracted_project
          else
            echo "Zip file not found in root!"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Find pubspec directory
        id: find_pubspec
        run: |
          PUB_DIR=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "pub_dir=$PUB_DIR" >> $GITHUB_OUTPUT
          echo "Found pubspec at: $PUB_DIR"

      - name: Build APK
        working-directory: ${{ steps.find_pubspec.outputs.pub_dir }}
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "**/outputs/flutter-apk/app-release.apk"
