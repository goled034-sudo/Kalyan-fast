name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Unzip project
        run: |
          unzip -q "kalyan fast.zip" -d extracted_folder
          echo "=== Contents of extracted folder ==="
          find extracted_folder -maxdepth 3 -name "pubspec.yaml"

      - name: Find and Build
        run: |
          # Find the exact directory containing pubspec.yaml inside extracted_folder
          PUB_PATH=$(find extracted_folder -name "pubspec.yaml" -print -quit)
          if [ -z "$PUB_PATH" ]; then
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PUB_PATH")
          echo "Found project directory at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "extracted_folder/**/build/app/outputs/flutter-apk/app-release.apk"
